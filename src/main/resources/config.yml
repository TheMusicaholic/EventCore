# EventCore only works in the event world (Settings.EventWorld), so the event can run on the same server as other worlds.
# Players join the event with '/event' and leave it with '/event leave' (or by going to another world in any other way).
# Their own items, ender chest, game mode, health, hunger, experience and effects are put away when they enter the event
# world and given back when they leave it: nothing can be brought into the event or taken out of it.
# While they're in the event world, they can only use the event's commands (see Settings.BlockCommands).
#
# In all commands below, %world% is replaced with the event world (like 'minecraft:event'). Use '/execute in %world% run ...'
# to limit a command to the event world: a plain '/kill @e' would kill the entities of every world on the server!

Settings:
  Metrics: true # Enable or disable the metrics system - https://bstats.org/
  EventWorld: 'event' # The world the event takes place in
  SpawnLocation: 'event/0/200/0' # Change the setting only with '/event setSpawn' (in the event world)
  EventWhitelist: # Staff (event.command or event.whitelist.bypass) can always join
    Enabled: false # Change the setting only with '/event whitelist <on / off>'
    Players: [] # Change the setting only with '/event whitelist <add / remove> <player>'
  MaxBuildHeight: 300 # Maximum build height
  DisableFallDamage: true # Disable fall damage
  DisableItemExplosions: true # Disable item explosions for End Crystal
  UnbreakableArmor: true # Armor never loses durability or breaks
  BlockCommands: # Players in the event world can only use the event's commands (/event, /event leave, /spawn). Staff (event.command or event.commands.bypass) can use all
    Enabled: true
    AllowedCommands: [] # Other commands they can still use, without the slash (like 'msg'). List every alias (like 'tell') and 'plugin:command' on its own
  Updates:
    NotifyOnJoin: true
    LogInConsole: false
  PlayerJoin:
    Commands: [] # Commands executed by the console when a player joins the event, leave empty to disable. %player% is replaced with the player's name
  PlayerQuit:
    Commands: [] # Commands executed by the console when a player leaves the event, leave empty to disable. %player% is replaced with the player's name
  HostRank:
    Enabled: false
    Permission: "event.host" # Permission which is required to receive the host rank upon joining the event
    JoinCommand: "lp user %player% parent add host"
    QuitCommand: "lp user %player% parent remove host"
  WorldBorder:
    AutoBorder: false # Change the default value of the AutoBorder feature
    DefaultSize: 200 # Default size before and after the event
    DisableEnderPeals: true # Disable EnderPeals outside the world border
    Boost: # Boost players who are outside the border into the border
      Enabled: true
      StrengthXZ: 1.3 # Strength in X and Z direction
      StrengthY: 0.1 # Strength in Y direction
    Damage:
      Buffer: 0.0 # It is recommended to use '0' if the boost is activated
      Amount: 0.2 # Damage per block
  MapReset:
    AutoReset: true # Automatically reset the map after /event stop
    Commands: # Commands that are executed by the console for map reset
      - "/arena reset ARENA extreme" # Example for https://github.com/StrangeOne101/PlatinumArenas
  AutoStop1Player: true # Automatically stop the event if only one player is alive
  AllowItemDropBeforeStart: true # Allow item drop and pickup before the event starts
  DropOnPlayerCount:
    Enabled: false
    Count: 15
  Drop:
    BorderExtra: 3 # Blocks that are dropped in addition to the border size
    CustomCommands: # Commands which are additionally executed after the drop
      - "/execute in %world% run kill @e[type=!player,distance=0..]"
  IngameTimer:
    Enabled: true
    Format: "&8» &chh:mm:ss &8«" # Format of the timer - hh = hours, mm = minutes, ss = seconds
  Start:
    CustomCommands: # Commands which are executed on start
      - "/execute in %world% run kill @e[type=!player,distance=0..]"
  Stop:
    CustomCommands: # Commands which are executed after the stop
      - "/event whitelist on"

Messages:
  Prefix: "&8 | &#559effEvent &8» &7"
  PlayerJoin:
    Enabled: true
    Message: "&a%player% &7joined the Event!"
  PlayerQuit:
    Enabled: true
    Message: "&c%player% &7left the Event!"
  PlayerDeath:
    Enabled: true
    Message1: "&8 | &c☠ &8» &c%player% &7was killed by &c%killer%&7!"
    Message2: "&8 | &c☠ &8» &c%player% &7died!" # Message when the player has simply died and there is no killer!
  BlockedCommand: "&cYou can't use this command in the event! Use &7/event leave &cto leave it." # See Settings.BlockCommands
  StartTimer:
    Timer: 5 # Timer in seconds
    Message: "The game starts in &c%timer% seconds!"
    Title: "%timer%" # 1st row
    SubTitle: "" # 2nd row
    Colors:
      1sec: "&a"
      2sec: "&e"
      3sec: "&6"
      4sec: "&c"
      5sec: "&4"
  Start:
    Message: "&aThe game starts now! Good luck!"
    Title: "&aStart!" # 1st row
    SubTitle: "" # 2nd row
  Stop:
    Enabled: true
    Message: "&cThe game has ended! The winner is %winner%"
    Title: "&c%winner%" # 1st row
    SubTitle: "&7is the winner" # 2nd row
  Actionbar:
    Enabled: false # Overrides the 'IngameTimer' setting
    Message: "&#559effYou are playing the best Event!" # Message that is displayed in the actionbar
  AnnoucementCommand: # %prefix% = Prefix, %message% = Message
    MessageFormat: "%prefix% %message%"
    Title:
      Enabled: true
      Title: "&#559eff&lANNOUNCEMENT" # 1st row
      SubTitle: "&7%message%" # 2nd row

AutoBroadcast: # Messages that are automatically broadcasted
  Enabled: true
  Interval: 60 # Interval in seconds
  Messages:
    - "&7Use &a/buy &7to support us and unlock cool features"
    - "&7You can also join our Discord with &c/discord"
  UseBroadcastCommand: false # Activate whether the 'BroadcastCommand' command should be used
  BroadcastCommand: "/bc %message%"

Kits: # Change the setting only with '/event kit'
  EnabledKit: 'default'
  Kits:
    default: '-'