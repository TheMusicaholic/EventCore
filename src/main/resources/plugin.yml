name: EventCore
version: ${version}
api-version: '26.3'
main: me.david.EventCore
author: VertrauterDavid, JavaMio
load: POSTWORLD
website: https://github.com/DavidArchive/EventCore
canvas-supported: true
# WorldEdit is only needed for /event drop.
softdepend: [PlaceholderAPI, WorldEdit]
permissions:
  event.join:
    description: Join the event with /event
    default: true
  event.whitelist.bypass:
    description: Join the event while it's whitelisted
    default: op
  event.commands.bypass:
    description: Use all commands in the event world, not only the event's
    default: op
